<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>문파 빨시 장부</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--tx:#1b1d21;--sub:#6b7280;--line:#e3e5e9;--pri:#d63c3c;--pri-t:#fff;--ok:#1f9d55;--warn:#c47a00;--chip:#eceef2}
@media(prefers-color-scheme:dark){:root{--bg:#14161a;--card:#1d2026;--tx:#eceef2;--sub:#9aa1ad;--line:#2b2f37;--chip:#2a2e36;--ok:#3ecf80;--warn:#f0b04a}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px}
body{padding:env(safe-area-inset-top) 0 calc(64px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto;padding:12px}
h2{font-size:13px;color:var(--sub);margin:16px 4px 8px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.big{font-size:44px;font-weight:800;letter-spacing:-1px;line-height:1.1}
.sub{color:var(--sub);font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
input,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--tx);font-size:15px;font-family:inherit}
input[type=number]{-moz-appearance:textfield}
button{font-family:inherit;font-size:14px;border:0;border-radius:10px;padding:10px 14px;background:var(--chip);color:var(--tx);cursor:pointer}
button.pri{background:var(--pri);color:var(--pri-t);font-weight:700}
button.big-btn{width:100%;padding:14px;font-size:16px}
button.sm{padding:6px 10px;font-size:13px}
button.on{background:var(--pri);color:var(--pri-t)}
button.ghost{background:transparent;border:1px solid var(--line)}
.chip{padding:8px 12px;border-radius:999px;background:var(--chip);font-size:14px}
.chip.on{background:var(--pri);color:var(--pri-t)}
.chip small{opacity:.7;margin-left:4px}
.list .it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.tag{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--chip);color:var(--sub)}
.t-불출{color:var(--pri)}.t-회수{color:var(--ok)}.t-입고{color:var(--warn)}
.del{opacity:.4;text-decoration:line-through}
.num{font-variant-numeric:tabular-nums;font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border-radius:0;background:transparent;padding:14px 0;color:var(--sub);font-weight:600}
nav button[aria-current=true]{color:var(--pri)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:9}
#toast.show{opacity:1}#toast.err{background:#b3261e}
.hide{display:none!important}
.ok{color:var(--ok)}.bad{color:var(--pri)}
</style>
</head>
<body>
<main>
  <!-- 최초 설정 -->
  <section id="setup" class="hide">
    <div class="card">
      <h2 style="margin-top:0">처음 한 번만 연결해요</h2>
      <p class="sub">Apps Script 웹 앱 배포 URL을 붙여넣어 주세요.</p>
      <input id="apiIn" placeholder="https://script.google.com/macros/s/.../exec">
      <button class="pri big-btn" style="margin-top:10px" onclick="saveApi()">연결</button>
    </div>
  </section>

  <!-- 현황 -->
  <section id="s-home" class="hide">
    <div class="card">
      <div class="sub">현재 재고 (빨간시약)</div>
      <div class="big" id="stock">-</div>
      <div class="sub" id="chk" style="margin-top:6px"></div>
    </div>
    <div class="card row">
      <div class="grow"><div class="sub">오늘 불출</div><div class="num" id="todayOut" style="font-size:22px">-</div></div>
      <div class="grow"><div class="sub">오늘 회수</div><div class="num" id="todayIn" style="font-size:22px">-</div></div>
      <div class="grow"><div class="sub">미반납 인원</div><div class="num" id="outCnt" style="font-size:22px">-</div></div>
    </div>
    <h2>미반납 (불출 − 회수)</h2>
    <div class="card list" id="outList"></div>
  </section>

  <!-- 입력 -->
  <section id="s-write" class="hide">
    <div class="card">
      <div class="row wrap" id="typeChips"></div>
      <div id="pickArea">
        <div class="row wrap" id="roleBtns" style="margin-top:12px"></div>
        <input id="filter" placeholder="이름 검색 / 새 이름 입력" style="margin-top:10px" oninput="renderPick()">
        <div class="row wrap" id="nameChips" style="margin-top:10px;max-height:190px;overflow:auto"></div>
        <div class="list" id="selList" style="margin-top:6px"></div>
      </div>
      <div class="row" style="margin-top:12px">
        <div class="grow"><div class="sub" id="qLabel">수량 (전체 적용)</div><input id="q0" type="number" inputmode="numeric" min="0" oninput="applyQ()"></div>
      </div>
      <input id="memo" placeholder="비고 (선택)" style="margin-top:10px">
      <button class="pri big-btn" style="margin-top:12px" onclick="submitRec()">저장</button>
    </div>
  </section>

  <!-- 기록 -->
  <section id="s-log" class="hide">
    <input id="logQ" placeholder="이름 검색" oninput="renderLog()">
    <div class="card list" id="logList" style="margin-top:10px"></div>
  </section>

  <!-- 관리 -->
  <section id="s-admin" class="hide">
    <h2>재고 검산</h2>
    <div class="card">
      <p class="sub" style="margin-top:0">카톡으로 받은 "남은 수량"을 적으면 계산값과 비교해서 남겨요.</p>
      <div class="row"><input id="chkQ" type="number" inputmode="numeric" placeholder="보고 수량"><input id="chkM" placeholder="메모"></div>
      <button class="big-btn" style="margin-top:10px" onclick="submitCheck()">검산 기록</button>
      <div class="list" id="chkList" style="margin-top:8px"></div>
    </div>
    <h2>명단 (직책은 언제든 수정)</h2>
    <div class="card">
      <div id="rosterEd"></div>
      <div class="row" style="margin-top:10px"><button onclick="addRow()">+ 추가</button><button class="pri grow" onclick="saveRoster()">명단 저장</button></div>
    </div>
    <h2>기타</h2>
    <div class="card row wrap">
      <button class="ghost sm" onclick="localStorage.removeItem('pw');toast('비밀번호를 다음 저장 때 다시 물어요')">비밀번호 다시 입력</button>
      <button class="ghost sm" onclick="if(confirm('연결 URL을 바꿀까요?')){localStorage.removeItem('api');location.reload()}">연결 URL 변경</button>
    </div>
  </section>
</main>

<nav id="nav" class="hide">
  <button data-t="s-home" aria-current="true">현황</button>
  <button data-t="s-write">입력</button>
  <button data-t="s-log">기록</button>
  <button data-t="s-admin">관리</button>
</nav>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Number(n || 0).toLocaleString("ko-KR");
let API = localStorage.getItem("api") || "";
let D = { roster: [], recs: [], checks: [], stock: 0 };
let type = "불출", sel = [], R = [], tab = "s-home";

function toast(m, err) { const t = $("#toast"); t.textContent = m; t.className = "show" + (err ? " err" : ""); clearTimeout(toast.h); toast.h = setTimeout(() => t.className = "", 2200); }

function saveApi() {
  const v = $("#apiIn").value.trim();
  if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(v)) return toast("URL 형식을 확인해 주세요", 1);
  localStorage.setItem("api", v); API = v; boot();
}

async function load() {
  try {
    const r = await fetch(API).then(r => r.json());
    if (r.ok) { D = r.data; renderAll(); }
  } catch (e) { toast("불러오기 실패", 1); }
}

async function write(action, payload) {
  let pw = localStorage.getItem("pw") || prompt("비밀번호");
  if (!pw) return null;
  try {
    const r = await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action, pw, ...payload }) }).then(r => r.json());
    if (!r.ok) { if (r.error === "pw") { localStorage.removeItem("pw"); toast("비밀번호가 달라요", 1); } else toast(r.error || "실패", 1); return null; }
    localStorage.setItem("pw", pw); D = r.data; renderAll(); return r;
  } catch (e) { toast("저장 실패 (네트워크)", 1); return null; }
}

function boot() {
  const has = !!API;
  $("#setup").classList.toggle("hide", has);
  $("#nav").classList.toggle("hide", !has);
  if (!has) { document.querySelectorAll("main > section:not(#setup)").forEach(s => s.classList.add("hide")); return; }
  go(tab); load();
}

function go(t) {
  tab = t;
  ["s-home", "s-write", "s-log", "s-admin"].forEach(id => $("#" + id).classList.toggle("hide", id !== t));
  document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-current", b.dataset.t === t));
  if (t === "s-admin") renderAdmin();
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => { go(b.dataset.t); if (b.dataset.t === "s-home") load(); });

const today = () => { const d = new Date(), p = n => String(n).padStart(2, "0"); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; };
const live = () => D.recs.filter(r => !r.del);

function renderAll() { renderHome(); renderPick(); renderLog(); if (tab === "s-admin") renderAdmin(); }

function renderHome() {
  $("#stock").textContent = fmt(D.stock);
  const c = D.checks[D.checks.length - 1];
  $("#chk").innerHTML = c ? `최근 검산 ${esc(c.t.slice(5))} · 보고 ${fmt(c.reported)} / 계산 ${fmt(c.calc)} · <b class="${c.diff === 0 ? "ok" : "bad"}">${c.diff === 0 ? "일치" : "차이 " + (c.diff > 0 ? "+" : "") + fmt(c.diff)}</b>` : "검산 기록 없음";
  const td = today(), L = live().filter(r => r.t.startsWith(td));
  $("#todayOut").textContent = fmt(L.filter(r => r.type === "불출").reduce((a, r) => a + r.qty, 0));
  $("#todayIn").textContent = fmt(L.filter(r => r.type === "회수").reduce((a, r) => a + r.qty, 0));
  const m = {};
  live().forEach(r => { if (!r.name) return; if (r.type === "불출") m[r.name] = (m[r.name] || 0) + r.qty; else if (r.type === "회수") m[r.name] = (m[r.name] || 0) - r.qty; });
  const roleOf = {}; D.roster.forEach(p => roleOf[p.name] = p.role);
  const out = Object.entries(m).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
  $("#outCnt").textContent = out.length;
  $("#outList").innerHTML = out.length ? out.map(([n, v]) => `<div class="it"><div class="grow">${esc(n)} ${roleOf[n] ? `<span class="tag">${esc(roleOf[n])}</span>` : ""}</div><div class="num">${fmt(v)}</div></div>`).join("") : `<div class="sub">미반납 없음</div>`;
}

/* ---------- 입력 ---------- */
function renderTypes() {
  $("#typeChips").innerHTML = ["불출", "회수", "입고"].map(t => `<button class="chip ${t === type ? "on" : ""}" onclick="setType('${t}')">${t}</button>`).join("");
  $("#pickArea").classList.toggle("hide", type === "입고");
  $("#qLabel").textContent = type === "입고" ? "입고 수량" : "수량 (전체 적용)";
}
function setType(t) { type = t; renderTypes(); }

function renderPick() {
  renderTypes();
  const roles = [...new Set(D.roster.map(p => p.role).filter(Boolean))];
  $("#roleBtns").innerHTML = roles.map(r => `<button class="sm ghost" onclick="pickRole('${esc(r).replace(/'/g, "\\'")}')">${esc(r)} 전원</button>`).join("");
  const f = $("#filter").value.trim();
  const names = D.roster.filter(p => !f || p.name.includes(f) || (p.role || "").includes(f));
  let h = names.map(p => `<button class="chip ${sel.some(s => s.name === p.name) ? "on" : ""}" data-n="${esc(p.name)}">${esc(p.name)}${p.role ? `<small>${esc(p.role)}</small>` : ""}</button>`).join("");
  if (f && !D.roster.some(p => p.name === f)) h += `<button class="chip" data-n="${esc(f)}" data-new="1">+ "${esc(f)}" 새로 추가</button>`;
  $("#nameChips").innerHTML = h || `<span class="sub">명단이 비었어요. 이름을 입력해서 추가하세요.</span>`;
  $("#nameChips").querySelectorAll("button").forEach(b => b.onclick = () => togglePick(b.dataset.n, b.dataset.new));
  renderSel();
}
function qNow() { return Number($("#q0").value) || 0; }
function togglePick(n, isNew) {
  const i = sel.findIndex(s => s.name === n);
  if (i >= 0) sel.splice(i, 1); else sel.push({ name: n, qty: qNow() });
  if (isNew) $("#filter").value = "";
  renderPick();
}
function pickRole(role) {
  D.roster.filter(p => p.role === role).forEach(p => { if (!sel.some(s => s.name === p.name)) sel.push({ name: p.name, qty: qNow() }); });
  renderPick();
}
function renderSel() {
  const roleOf = {}; D.roster.forEach(p => roleOf[p.name] = p.role);
  $("#selList").innerHTML = sel.map((s, i) => `<div class="it"><div class="grow">${esc(s.name)} ${roleOf[s.name] ? `<span class="tag">${esc(roleOf[s.name])}</span>` : ""}</div><input type="number" inputmode="numeric" value="${s.qty || ""}" style="width:90px" oninput="sel[${i}].qty=Number(this.value)||0"><button class="sm ghost" onclick="sel.splice(${i},1);renderPick()">✕</button></div>`).join("");
}
function applyQ() { const q = qNow(); sel.forEach(s => s.qty = q); renderSel(); }

async function submitRec() {
  const memo = $("#memo").value.trim();
  let rows;
  if (type === "입고") rows = [{ type, name: "", qty: qNow(), memo }];
  else rows = sel.filter(s => s.qty > 0).map(s => ({ type, name: s.name, qty: s.qty, memo }));
  if (!rows.length) return toast("대상과 수량을 확인해 주세요", 1);
  const sum = rows.reduce((a, r) => a + r.qty, 0);
  if (!confirm(`${type} ${rows.length}건 · 합계 ${fmt(sum)}개\n저장할까요?`)) return;
  const r = await write("add", { rows });
  if (r) { sel = []; $("#q0").value = ""; $("#memo").value = ""; $("#filter").value = ""; renderPick(); toast("저장했어요"); }
}

/* ---------- 기록 ---------- */
function renderLog() {
  const q = $("#logQ").value.trim();
  const L = D.recs.slice().reverse().filter(r => !q || r.name.includes(q) || r.memo.includes(q)).slice(0, 150);
  $("#logList").innerHTML = L.map(r => `<div class="it ${r.del ? "del" : ""}"><div class="grow"><div><b class="t-${r.type}">${r.type}</b> ${esc(r.name || "")} ${r.role ? `<span class="tag">${esc(r.role)}</span>` : ""}</div><div class="sub">${esc(r.t)}${r.memo ? " · " + esc(r.memo) : ""}</div></div><div class="num">${fmt(r.qty)}</div><button class="sm ghost" onclick="delRec('${r.id}',${r.del})">${r.del ? "복구" : "삭제"}</button></div>`).join("") || `<div class="sub">기록 없음</div>`;
}
async function delRec(id, undo) { if (!undo && !confirm("이 기록을 삭제할까요? (복구 가능)")) return; await write("del", { id, undo }); }

/* ---------- 관리 ---------- */
function renderAdmin() {
  if (!R.length || R._src !== D.roster) { R = D.roster.map(p => ({ ...p })); R._src = D.roster; }
  drawRoster();
  $("#chkList").innerHTML = D.checks.slice(-5).reverse().map(c => `<div class="it"><div class="grow"><div>${esc(c.t.slice(5))} · 보고 ${fmt(c.reported)} / 계산 ${fmt(c.calc)}</div><div class="sub">${esc(c.memo)}</div></div><b class="${c.diff === 0 ? "ok" : "bad"}">${c.diff === 0 ? "일치" : (c.diff > 0 ? "+" : "") + fmt(c.diff)}</b></div>`).join("");
}
function drawRoster() {
  $("#rosterEd").innerHTML = R.map((p, i) => `<div class="row" style="margin-bottom:6px"><input value="${esc(p.name)}" placeholder="캐릭명" oninput="R[${i}].name=this.value"><input value="${esc(p.role)}" placeholder="직책" oninput="R[${i}].role=this.value"><button class="sm ghost" onclick="R.splice(${i},1);drawRoster()">✕</button></div>`).join("") || `<div class="sub">명단이 비었어요</div>`;
}
function addRow() { R.push({ name: "", role: "", memo: "" }); drawRoster(); }
async function saveRoster() {
  const list = R.map(p => ({ name: p.name.trim(), role: p.role.trim(), memo: p.memo || "" })).filter(p => p.name);
  if (new Set(list.map(p => p.name)).size !== list.length) return toast("이름이 중복돼요", 1);
  const r = await write("roster", { list }); if (r) { R = []; renderAdmin(); toast("명단 저장"); }
}
async function submitCheck() {
  const v = $("#chkQ").value; if (v === "") return toast("보고 수량을 적어 주세요", 1);
  const r = await write("check", { reported: Number(v), memo: $("#chkM").value.trim() });
  if (r) { $("#chkQ").value = ""; $("#chkM").value = ""; toast("검산 기록"); }
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
boot();
</script>
</body>
</html>
